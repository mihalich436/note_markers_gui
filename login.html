<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - The Lazy DM's Notes</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="icon" href="./icons/yellow_dragon_sleep.ico" type="image/x-icon">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1 data-i18n="auth.login_title">📝 Log in</h1>
            <p style="color: #666; margin-bottom: 30px;" data-i18n="auth.login_subtitle">
                Manage notes for locations on your map
            </p>

            <form id="loginForm">
                <div class="form-group">
                    <label data-i18n="auth.email_label">Email</label>
                    <input type="text" id="email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label data-i18n="auth.password_label">Password</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
                <button type="submit" data-i18n="auth.login_button">Log in</button>
            </form>

            <p style="margin-top: 20px; text-align: center;">
                <span data-i18n="auth.no_account">Don't have an account?</span>
                <a href="./register.html" data-i18n="auth.register_link">Sign up</a>
            </p>

            <div style="text-align: center; margin-top: 15px;">
                <div id="langSwitcher" class="lang-switcher" aria-label="Language"></div>
            </div>
        </div>
        <div class="system-message-container"></div>
    </div>

    <script src="./js/config.js"></script>
    <script src="./js/i18n.js"></script>
    <script src="./js/common.js"></script>
    <script>
        (async () => {
            await initI18n();
            loadUserInfo();

            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                try {
                    const response = await fetch(`${API_URL}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('username', data.username);

                        const pendingInvite = localStorage.getItem('pendingInvite');
                        if (pendingInvite) {
                            localStorage.removeItem('pendingInvite');
                            window.location.href = `/invite.html?token=${pendingInvite}`;
                        } else {
                            window.location.href = './projects.html';
                        }
                    } else {
                        showMessage(data.message || t('auth.error_login'));
                    }
                } catch (error) {
                    showMessage(t('common.error_connection'));
                }
            });
        })();
    </script>
</body>
</html>
