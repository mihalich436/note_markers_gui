<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="note.default_title">Note — The Lazy DM's Notes</title>
    <link rel="icon" href="./icons/yellow_dragon_sleep.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/chat-view.css">
    <link rel="stylesheet" href="./css/notes_styles.css">
</head>
<body>
    <div class="container">
        <div class="navbar">
            <div class="navbar-left">
                <button id="notesSidebarToggle" class="sidebar-toggle"
                        data-i18n-title="note.sidebar_title"
                        title="Project notes" aria-label="Project notes">☰</button>
                <a href="./project.html" class="logo" id="backToProjectLink">
                    <img src="./icons/logo.png" alt="" class="logo-img">
                    <span class="logo-text" data-i18n="app.name">The Lazy DM's Notes</span>
                </a>
            </div>
            <div class="navbar-center">
                <h1 id="noteTitleTop" class="note-title-top" data-i18n="note.default_title">Note</h1>
            </div>
            <div class="navbar-right">
            </div>
        </div>

        <div class="notes-layout">
            <aside id="notesSidebar" class="notes-sidebar" aria-label="Project notes">
                <div class="notes-sidebar-header">
                    <span data-i18n="note.sidebar_title">Project notes</span>
                </div>
                <div id="notesList" class="notes-list"></div>
            </aside>

            <div id="notesSidebarOverlay" class="sidebar-overlay hidden"></div>

            <main id="viewModalContent" class="view-modal-content notes-center">
                <div class="view-modal-body">
                    <div id="chatMessages" class="chat-messages"></div>
                    <div id="chatInputArea" class="chat-input-area">
                        <div id="staticFormatToolbar" class="static-format-toolbar">
                            <button class="format-btn" data-format="bold" data-i18n-title="map.format_bold" title="Bold (Ctrl+B)"><b>B</b></button>
                            <button class="format-btn" data-format="italic" data-i18n-title="map.format_italic" title="Italic (Ctrl+I)"><i>I</i></button>
                            <button class="format-btn" data-format="underline" data-i18n-title="map.format_underline" title="Underline (Ctrl+U)"><u>U</u></button>
                            <span class="format-sep"></span>
                            <button class="format-btn" data-format="link" data-i18n-title="map.format_link" title="Link">🔗</button>
                            <button class="format-btn" data-format="image" data-i18n-title="map.format_image" title="Image by URL">🖼️</button>
                            <span class="format-sep"></span>
                            <button class="format-btn" data-format="copy" data-i18n-title="map.format_copy" title="Copy">📋</button>
                            <button class="format-btn" data-format="cut" data-i18n-title="map.format_cut" title="Cut">✂️</button>
                            <button class="format-btn" data-format="paste" data-i18n-title="map.format_paste" title="Paste">📥</button>
                            <button class="format-btn" data-format="clear" data-i18n-title="map.format_clear" title="Clear formatting">⌫</button>
                        </div>
                        <div class="chat-input-row">
                            <div id="chatInput" class="chat-input-resizable" contenteditable="true"></div>
                            <button id="visChatBtn" class="visible-message-btn"
                                    data-i18n-title="map.notification_visibility_all"
                                    title="Note will be visible to everyone"></button>
                            <button id="sendChatBtn" class="send-message-btn"></button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div id="formatToolbar" class="format-toolbar hidden">
        <button class="format-btn" data-format="bold" data-i18n-title="map.format_bold" title="Bold (Ctrl+B)"><b>B</b></button>
        <button class="format-btn" data-format="italic" data-i18n-title="map.format_italic" title="Italic (Ctrl+I)"><i>I</i></button>
        <button class="format-btn" data-format="underline" data-i18n-title="map.format_underline" title="Underline (Ctrl+U)"><u>U</u></button>
        <span class="format-sep"></span>
        <button class="format-btn" data-format="link" data-i18n-title="map.format_link" title="Link">🔗</button>
        <button class="format-btn" data-format="image" data-i18n-title="map.format_image" title="Image by URL">🖼️</button>
        <span class="format-sep"></span>
        <button class="format-btn" data-format="copy" data-i18n-title="map.format_copy" title="Copy">📋</button>
        <button class="format-btn" data-format="cut" data-i18n-title="map.format_cut" title="Cut">✂️</button>
        <button class="format-btn" data-format="paste" data-i18n-title="map.format_paste" title="Paste">📥</button>
        <button class="format-btn" data-format="clear" data-i18n-title="map.format_clear" title="Clear formatting">⌫</button>
    </div>

    <div id="linkDialog" class="link-dialog hidden">
        <div class="link-dialog-content">
            <h4 id="linkDialogTitle" data-i18n="chat.link_dialog_title">Insert link</h4>

            <div class="link-dialog-tabs">
                <button type="button" class="link-dialog-tab active" data-link-tab="url"  data-i18n="chat.link_tab_url">URL</button>
                <button type="button" class="link-dialog-tab"        data-link-tab="map"  data-i18n="chat.link_tab_map">Map</button>
                <button type="button" class="link-dialog-tab"        data-link-tab="note" data-i18n="chat.link_tab_note">Note</button>
            </div>

            <!-- Вкладка «Ссылка» -->
            <div class="link-dialog-pane" data-link-pane="url">
                <input type="text" id="linkDialogUrl" data-i18n-placeholder="chat.link_dialog_url_placeholder" placeholder="https://..." />
            </div>

            <!-- Вкладка «Карта» -->
            <div class="link-dialog-pane hidden" data-link-pane="map">
                <input type="text" id="linkMapFilter" class="link-dialog-filter"
                       data-i18n-placeholder="chat.link_filter_placeholder" placeholder="Search..." />
                <div id="linkMapList" class="link-dialog-list"></div>
            </div>

            <!-- Вкладка «Заметка» -->
            <div class="link-dialog-pane hidden" data-link-pane="note">
                <input type="text" id="linkNoteFilter" class="link-dialog-filter"
                       data-i18n-placeholder="chat.link_filter_placeholder" placeholder="Search..." />
                <div id="linkNoteList" class="link-dialog-list"></div>
            </div>

            <input type="text" id="linkDialogText"
                   data-i18n-placeholder="chat.link_dialog_text_placeholder" placeholder="Text (optional)" />

            <div class="link-dialog-buttons">
                <button id="linkDialogCancel" data-i18n="chat.link_dialog_cancel">Cancel</button>
                <button id="linkDialogOk" class="primary" data-i18n="chat.link_dialog_ok">Insert</button>
            </div>
        </div>
    </div>

    <div id="imageUploadDialog" class="link-dialog hidden">
        <div class="link-dialog-content image-upload-dialog-content">
            <h4 data-i18n="map.image_dialog_title">Insert image</h4>
            <div class="image-upload-tabs">
                <button type="button" class="image-upload-tab active" data-tab="url" data-i18n="map.image_tab_url">By URL</button>
                <button type="button" class="image-upload-tab" data-tab="file" data-i18n="map.image_tab_file">Upload</button>
            </div>
            <div class="image-upload-pane" data-pane="url">
                <input type="text" id="imageUploadUrl" data-i18n-placeholder="map.image_dialog_url_placeholder" placeholder="https://..." />
            </div>
            <div class="image-upload-pane hidden" data-pane="file">
                <input type="file" id="imageUploadFile" accept="image/png,image/jpeg,image/webp,image/avif" />
                <div id="imageUploadPreviewWrap" class="image-upload-preview-wrap hidden">
                    <img id="imageUploadPreview" alt="Preview" />
                    <div id="imageUploadInfo" class="image-upload-info"></div>
                </div>
            </div>
            <div id="imageUploadError" class="image-upload-error hidden"></div>
            <div class="link-dialog-buttons">
                <button id="imageUploadCancel" type="button" data-i18n="map.link_dialog_cancel">Cancel</button>
                <button id="imageUploadOk" type="button" class="primary" disabled data-i18n="map.image_dialog_ok">Insert</button>
            </div>
        </div>
    </div>

    <script src="./js/sockjs.min.js"></script>
    <script src="./js/stomp.min.js"></script>
    <script src="./js/config.js"></script>
    <script src="./js/i18n.js"></script>
    <script src="./js/common.js"></script>
    <script src="./js/WsClient.js"></script>
    <script src="./js/image-compress.js"></script>
    <script src="./js/chat-view.js"></script>
    <script>
        (async () => {
            await initI18n();
            const script = document.createElement('script');
            script.src = './js/notes.js';
            document.body.appendChild(script);
        })();
    </script>
</body>
</html>
