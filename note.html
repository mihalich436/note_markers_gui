<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Заметка — The Lazy DM's Notes</title>
    <link rel="icon" href="./icons/yellow_dragon_sleep.ico" type="image/x-icon">
    <link rel="stylesheet" href="./css/chat-view.css">
    <link rel="stylesheet" href="./css/notes_styles.css">
</head>
<body>
    <div class="container">
        <!-- Верхняя навигация -->
        <div class="navbar">
            <div class="navbar-left">
                <button id="notesSidebarToggle" class="sidebar-toggle" title="Список заметок" aria-label="Список заметок">☰</button>
                <a href="./project.html" class="logo" id="backToProjectLink">
                    <img src="./icons/logo.png" alt="" class="logo-img">
                    <span class="logo-text">The Lazy DM's Notes</span>
                </a>
            </div>
            <div class="navbar-center">
                <h1 id="noteTitleTop" class="note-title-top">Заметка</h1>
            </div>
        </div>

        <!-- Основной контент -->
        <div class="notes-layout">
            <!-- Левая колонка: список заметок проекта -->
            <aside id="notesSidebar" class="notes-sidebar" aria-label="Список заметок">
                <div class="notes-sidebar-header">
                    <span>Заметки проекта</span>
                </div>
                <div id="notesList" class="notes-list"></div>
            </aside>

            <!-- Оверлей для мобильных, когда сайдбар открыт -->
            <div id="notesSidebarOverlay" class="sidebar-overlay hidden"></div>

            <!-- Центральная колонка: сам чат -->
            <main id="viewModalContent" class="view-modal-content notes-center">
                <div class="view-modal-body">
                    <div id="chatMessages" class="chat-messages"></div>
                    <div id="chatInputArea" class="chat-input-area hidden">
                        <div id="chatInput" class="chat-input-resizable" contenteditable="true"></div>
                        <button id="visChatBtn" class="visible-message-btn" title="Заметка будет видна всем"></button>
                        <button id="sendChatBtn" class="send-message-btn"></button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Плавающий тулбар форматирования -->
    <div id="formatToolbar" class="format-toolbar hidden">
        <button class="format-btn" data-format="bold" title="Жирный (Ctrl+B)"><b>B</b></button>
        <button class="format-btn" data-format="italic" title="Курсив (Ctrl+I)"><i>I</i></button>
        <button class="format-btn" data-format="underline" title="Подчёркнутый (Ctrl+U)"><u>U</u></button>
        <span class="format-sep"></span>
        <button class="format-btn" data-format="link" title="Ссылка">🔗</button>
        <button class="format-btn" data-format="image" title="Картинка по ссылке">🖼️</button>
        <span class="format-sep"></span>
        <button class="format-btn" data-format="copy" title="Копировать">📋</button>
        <button class="format-btn" data-format="cut" title="Вырезать">✂️</button>
        <button class="format-btn" data-format="paste" title="Вставить">📥</button>
        <button class="format-btn" data-format="clear" title="Очистить форматирование">⌫</button>
    </div>

    <div id="linkDialog" class="link-dialog hidden">
        <div class="link-dialog-content">
            <h4 id="linkDialogTitle">Вставить ссылку</h4>
            <input type="text" id="linkDialogUrl" placeholder="https://..." />
            <input type="text" id="linkDialogText" placeholder="Текст ссылки (необязательно)" />
            <div class="link-dialog-buttons">
                <button id="linkDialogCancel">Отмена</button>
                <button id="linkDialogOk" class="primary">Вставить</button>
            </div>
        </div>
    </div>

    <script src="./js/sockjs.min.js"></script>
    <script src="./js/stomp.min.js"></script>
    <script src="./js/config.js"></script>
    <script src="./js/common.js"></script>
    <script src="./js/WsClient.js"></script>
    <script src="./js/chat-view.js"></script>
    <script src="./js/notes.js"></script>
</body>
</html>
